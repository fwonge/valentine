<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff4d6d, #ff9a9e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* Floating Polaroid */
    .polaroid {
      position: absolute;
      width: 320px;
      background: white;
      padding: 15px 15px 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transform: rotate(-6deg);
      top: 60px;
      left: 60px;
      animation: float 4s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes float {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50% { transform: rotate(-6deg) translateY(-12px); }
    }

    .polaroid img {
      width: 100%;
      display: block;
    }

    .polaroid p {
      margin: 10px 0 0;
      text-align: center;
      font-family: 'Comic Sans MS', cursive;
      color: #444;
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 400px;
      color: white;
      text-align: center;
      z-index: 1;
      backdrop-filter: blur(6px);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    button {
      font-size: 1.1rem;
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #yesBtn {
      background: #ff2f5b;
      color: white;
    }

    #yesBtn:hover {
      transform: scale(1.05);
    }

    #noBtn {
      background: #ffd1dc;
      color: #b3003b;
      animation: shake 1.5s infinite;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      50% { transform: translateX(3px); }
      75% { transform: translateX(-3px); }
    }

    /* Hearts */
    .heart {
      position: fixed;
      color: #ff2f5b;
      font-size: 24px;
      animation: fall 3s linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      from {
        transform: translateY(-20px);
        opacity: 1;
      }
      to {
        transform: translateY(100vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Polaroid -->
  <div class="polaroid">
    <img src="polaroid.jpg" alt="Us 💕">
    <p>Us 💖</p>
  </div>

  <!-- Main Card -->
  <div class="card">
    <h1>Hey 💕</h1>
    <p>Will you be my Valentine?</p>
    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
      <button id="noBtn" onmouseover="moveNo()">No 🙈</button>
    </div>
  </div>

  <script>
    function sayYes() {
      hearts();
      document.body.innerHTML = `
        <div style="
          display:flex;
          align-items:center;
          justify-content:center;
          height:100vh;
          background: linear-gradient(135deg, #ff4d6d, #ff9a9e);
          color:white;
          font-family:'Segoe UI', sans-serif;
          text-align:center;
        ">
          <div>
            <h1>Yayyy 💘</h1>
            <p style="font-size:1.3rem;">
              Will you accept your presents on<br>
              <strong>Thursday 12th February?</strong> 🎁💞
            </p>
            <div style="margin-top:30px; display:flex; gap:20px; justify-content:center;">
              <button onclick="acceptYes()" style="
                padding:12px 24px;
                border:none;
                border-radius:25px;
                background:#ff2f5b;
                color:white;
                font-size:1.1rem;
              ">Of course 💝</button>
              <button onclick="acceptNo()" style="
                padding:12px 24px;
                border:none;
                border-radius:25px;
                background:#ffd1dc;
                color:#b3003b;
                font-size:1.1rem;
              ">No 🙈</button>
            </div>
          </div>
        </div>
      `;
    }

    function acceptYes() {
      hearts();
      document.body.innerHTML = `
        <div style="
          display:flex;
          align-items:center;
          justify-content:center;
          height:100vh;
          background: linear-gradient(135deg, #ff4d6d, #ff9a9e);
          color:white;
          font-family:'Segoe UI', sans-serif;
          text-align:center;
        ">
          <div>
            <h1>Perfect 💞</h1>
            <p style="font-size:1.4rem;">I can’t wait to spoil you 💝</p>
          </div>
        </div>
      `;
    }

    function acceptNo() {
      document.body.innerHTML = `
        <div style="
          display:flex;
          align-items:center;
          justify-content:center;
          height:100vh;
          background: linear-gradient(135deg, #ff4d6d, #ff9a9e);
          color:white;
          font-family:'Segoe UI', sans-serif;
          text-align:center;
        ">
          <div>
            <h1>Too bad 😌</h1>
            <p style="font-size:1.5rem;">too bad baby girl 💘</p>
          </div>
        </div>
      `;
    }

    function moveNo() {
      const btn = document.getElementById("noBtn");
      btn.style.transform = `translate(${Math.random()*180-90}px, ${Math.random()*180-90}px)`;
    }

    function hearts() {
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 20 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
      }
    }
  </script>

</body>
</html>
